name: Desplegar SeñasConecta en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "datos/**"
      - "scripts/importar_excel.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Integrar planillas Excel hacia JSON
        run: python3 scripts/importar_excel.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar frontend estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: "frontend"

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
